name: Publish Line Dog Wallpaper v2.0.11

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v2.0.11.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin and installer
        run: ./tests/test-static.sh
      - name: Package installer
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import zipfile

          names = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          with zipfile.ZipFile("Line-Dog-Wallpaper-Installer.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  if not name:
                      continue
                  path = pathlib.Path(name)
                  info = zipfile.ZipInfo(name)
                  info.external_attr = (path.stat().st_mode & 0xffff) << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  archive.writestr(info, path.read_bytes())
          PY
          for theme in Yellow-Together Blue-Sky Blue-Daily Pink-Friends; do
            source="plugins/codex-line-dog-wallpaper/assets/line-dog-$(echo "$theme" | tr '[:upper:]' '[:lower:]')-3840x2400.jpg"
            cp "$source" "Line-Dog-$theme-3840x2400.jpg"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          Adapts all four Line Dog wallpapers to the current Codex desktop layout.

          - Sidebar and conversation share one continuous wallpaper.
          - Conversation and composer remain visible.
          - Native Codex icons, solid selected-row color, black user bubbles, and translucent assistant cards.
          - Pink Friends uses a lighter pink in light mode.

          Download the installer ZIP below, or use the install command in the README.
          EOF
          gh release create v2.0.11 \
            Line-Dog-Wallpaper-Installer.zip \
            Line-Dog-Yellow-Together-3840x2400.jpg \
            Line-Dog-Blue-Sky-3840x2400.jpg \
            Line-Dog-Blue-Daily-3840x2400.jpg \
            Line-Dog-Pink-Friends-3840x2400.jpg \
            --title "Line Dog Wallpaper v2.0.11" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
